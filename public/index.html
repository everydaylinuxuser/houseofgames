<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>House of Games</title>
  <style>
    body {
      background: #1a0b2e;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-align: center;
      padding: 20px;
      margin: 0;
    }
    h1 { color: #f4d03f; margin-bottom: 20px; }
    .card {
      background: #2b124c;
      padding: 25px;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
      max-width: 440px;
      margin: 0 auto;
    }
    input[type="text"] {
      width: 100%; padding: 14px; font-size: 18px; border-radius: 8px; border: 2px solid #4a154b; background: #1a0b2e; color: #fff; box-sizing: border-box; margin-bottom: 20px; text-align: center;
    }
    .btn-main { width: 100%; padding: 14px; font-size: 18px; font-weight: bold; background: #e63946; color: white; border: none; border-radius: 8px; cursor: pointer; }
    #game-screen { display: none; }
    .score-badge { font-size: 20px; color: #f4d03f; background: #1a0b2e; padding: 6px 16px; border-radius: 8px; display: inline-block; margin-bottom: 20px; border: 1px solid #4a154b; }
    
    #player-buzzer-question, #player-answer-banner {
      border-radius: 12px; padding: 15px; margin-bottom: 20px; font-size: 18px; font-weight: bold; color: #fff; line-height: 1.3; display: none;
    }
    #player-buzzer-question { background: #1e3a8a; border: 1px solid #60a5fa; }
    #player-answer-banner { background: #064e3b; border: 1px solid #34d399; font-size: 22px; }

    .view-section { display: none; }
    .view-section.active-view { display: block; }

    #buzzer-btn {
      width: 200px; height: 200px; border-radius: 50%; font-size: 32px; font-weight: bold; color: white; border: 8px solid rgba(255,255,255,0.2); cursor: not-allowed; background: #555; box-shadow: 0 10px 30px rgba(0,0,0,0.5); margin: 0 auto;
    }
    #buzzer-btn.active { background: radial-gradient(circle, #ff4d4d 0%, #cc0000 100%); cursor: pointer; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(255, 77, 77, 0.7); } 70% { box-shadow: 0 0 0 20px rgba(255, 77, 77, 0); } 100% { box-shadow: 0 0 0 0 rgba(255, 77, 77, 0); } }

    .vm-phone-chip {
      display: inline-block;
      background: #0f172a;
      border: 2px solid #f4d03f;
      color: #fff;
      font-weight: 900;
      padding: 6px 12px;
      border-radius: 8px;
      margin: 4px;
      font-size: 18px;
    }

    /* Interactive Map Pin Container */
    #player-map-wrapper {
      position: relative;
      display: inline-block;
      width: 100%;
      border: 2px solid #60a5fa;
      border-radius: 10px;
      overflow: hidden;
      cursor: crosshair;
      margin-bottom: 15px;
      touch-action: manipulation;
    }
    #player-map-img {
      display: block;
      width: 100%;
      height: auto;
      user-select: none;
      -webkit-user-drag: none;
    }
    .phone-pin {
      position: absolute;
      transform: translate(-50%, -100%);
      pointer-events: none;
      font-size: 26px;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.8));
    }
  </style>
</head>
<body>

  <h1>🎮 House of Games</h1>

  <div class="card" id="join-screen">
    <h2>Enter Your Name</h2>
    <input type="text" id="name-input" placeholder="e.g. Aunt Linda" autocomplete="off" />
    <button class="btn-main" onclick="joinGame()">Join Game</button>
  </div>

  <div class="card" id="game-screen">
    <h2 id="welcome-msg" style="margin-top: 0; margin-bottom: 8px;"></h2>
    <div class="score-badge">Score: <strong id="my-score">0</strong></div>

    <div id="player-answer-banner">
      <div style="font-size: 12px; text-transform: uppercase; color: #a7f3d0; margin-bottom: 5px;">Correct Answer</div>
      <div id="player-answer-text"></div>
    </div>

    <!-- BUZZER & VOWEL MOVEMENT VIEW -->
    <div id="buzzer-view" class="view-section active-view">
      <div id="player-buzzer-question"></div>
      
      <div id="player-image-container" style="display: none; justify-content: center; align-items: center; gap: 10px; margin-bottom: 20px;">
        <img id="player-img1" src="" style="max-height: 140px; max-width: 45%; border-radius: 8px; border: 2px solid #60a5fa; object-fit: contain;" />
        <div style="font-size: 28px; color: #f4d03f; font-weight: bold;">+</div>
        <img id="player-img2" src="" style="max-height: 140px; max-width: 45%; border-radius: 8px; border: 2px solid #60a5fa; object-fit: contain;" />
      </div>

      <div class="buzzer-container">
        <button id="buzzer-btn" onclick="pressBuzzer()" disabled>WAIT</button>
        <div id="buzzer-status-text" style="color: #94a3b8; margin-top: 15px; font-weight: bold;">Waiting for host...</div>
      </div>
    </div>

    <!-- SECRET INPUT VIEW -->
    <div id="secret-view" class="view-section">
      <h3 id="secret-prompt-title" style="color: #38bdf8; margin-top: 0;">Secret Question</h3>
      
      <div id="secret-image-container" style="display: none; justify-content: center; align-items: center; gap: 10px; margin-bottom: 20px;">
        <img id="sec-img1" src="" style="max-height: 140px; max-width: 45%; border-radius: 8px; border: 2px solid #60a5fa; object-fit: contain;" />
        <div style="font-size: 28px; color: #f4d03f; font-weight: bold;">+</div>
        <img id="sec-img2" src="" style="max-height: 140px; max-width: 45%; border-radius: 8px; border: 2px solid #60a5fa; object-fit: contain;" />
      </div>

      <div id="input-container">
        <input type="text" id="secret-answer-input" placeholder="Type your answer..." autocomplete="off" />
        <button class="btn-main" onclick="submitAnswer()" style="background: #22c55e;">Lock In Answer!</button>
      </div>
      <div id="waiting-msg" style="display:none; color: #4ade80; font-weight: bold; font-size: 18px; padding: 20px;">
        🔒 Answer Locked In! Waiting for reveal...
      </div>
    </div>

    <!-- INDIVIDUAL / HIGHBROW-LOWBROW VIEW -->
    <div id="individual-view" class="view-section">
      <div id="individual-header-msg" style="font-size: 20px; font-weight: bold; color: #f4d03f; margin-bottom: 10px;"></div>
      <div id="hl-tier-badge" style="display: none; background: #4c1d95; border: 1px solid #a78bfa; color: #f4d03f; padding: 6px 12px; border-radius: 20px; font-size: 13px; font-weight: bold; margin-bottom: 12px;"></div>
      <div id="player-individual-question" style="background: #1e3a8a; border: 1px solid #60a5fa; border-radius: 12px; padding: 15px; margin-bottom: 20px; font-size: 18px; font-weight: bold; display: none;"></div>
      
      <div id="individual-image-container" style="display: none; justify-content: center; align-items: center; gap: 10px; margin-bottom: 20px;">
        <img id="ind-img1" src="" style="max-height: 140px; max-width: 45%; border-radius: 8px; border: 2px solid #60a5fa; object-fit: contain;" />
        <div style="font-size: 28px; color: #f4d03f; font-weight: bold;">+</div>
        <img id="ind-img2" src="" style="max-height: 140px; max-width: 45%; border-radius: 8px; border: 2px solid #60a5fa; object-fit: contain;" />
      </div>
      
      <div id="individual-instructions" style="color: #94a3b8; font-size: 16px; padding: 15px;"></div>
    </div>

    <!-- WHERE IS KAZAKHSTAN? (MAP PIN VIEW) -->
    <div id="map-view" class="view-section">
      <h3 id="map-prompt-title" style="color: #38bdf8; margin-top: 0; margin-bottom: 12px;">Tap the Map!</h3>
      <div id="player-map-wrapper" onclick="placeMapPin(event)">
        <img id="player-map-img" src="" />
        <div id="my-map-pin" class="phone-pin" style="display: none;">📍</div>
        <div id="target-map-pin" class="phone-pin" style="display: none;">🎯</div>
      </div>
      <button id="btn-lock-map-pin" class="btn-main" onclick="submitMapPin()" style="background: #22c55e;">📍 Lock In Pin!</button>
      <div id="map-waiting-msg" style="display: none; color: #4ade80; font-weight: bold; font-size: 17px; padding: 12px;">
        🔒 Pin Locked In! Look at the TV for the reveal...
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    let selectedMapCoords = null;
    let mapLockedIn = false;
    let isVMMode = false;

    function playBuzzerSound() {
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        const ctx = new AudioContext();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(130, ctx.currentTime);
        gain.gain.setValueAtTime(0.3, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.5);
        
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.5);
      } catch (e) {}
    }

    window.addEventListener('beforeunload', (event) => {
      if (document.getElementById('game-screen').style.display === 'block') {
        event.preventDefault();
        event.returnValue = '';
      }
    });

    window.addEventListener('load', () => {
      const savedName = localStorage.getItem('hog_player_name');
      if (savedName) {
        document.getElementById('name-input').value = savedName;
      }
    });

    function joinGame() {
      const name = document.getElementById('name-input').value.trim();
      if (!name) {
        alert('Please enter a name first!');
        return;
      }
      localStorage.setItem('hog_player_name', name);
      socket.emit('join-game', name);
      document.getElementById('join-screen').style.display = 'none';
      document.getElementById('game-screen').style.display = 'block';
      document.getElementById('welcome-msg').innerText = name;
    }

    function pressBuzzer() { 
      playBuzzerSound(); 
      socket.emit('player-buzz'); 
    }

    function submitAnswer() {
      const answer = document.getElementById('secret-answer-input').value;
      if (!answer.trim()) { alert('Please type an answer first!'); return; }
      socket.emit('submit-answer', answer);
    }

    function placeMapPin(event) {
      if (mapLockedIn) return;
      const wrapper = document.getElementById('player-map-wrapper');
      const rect = wrapper.getBoundingClientRect();
      const xPct = ((event.clientX - rect.left) / rect.width) * 100;
      const yPct = ((event.clientY - rect.top) / rect.height) * 100;

      selectedMapCoords = {
        x: Math.max(0, Math.min(100, Number(xPct.toFixed(2)))),
        y: Math.max(0, Math.min(100, Number(yPct.toFixed(2))))
      };

      const pin = document.getElementById('my-map-pin');
      pin.style.left = `${selectedMapCoords.x}%`;
      pin.style.top = `${selectedMapCoords.y}%`;
      pin.style.display = 'block';
    }

    function submitMapPin() {
      if (!selectedMapCoords) {
        alert('Tap anywhere on the map first to place your pin!');
        return;
      }
      socket.emit('submit-map-guess', selectedMapCoords);
    }

    socket.on('map-guess-confirmed', () => {
      mapLockedIn = true;
      document.getElementById('btn-lock-map-pin').style.display = 'none';
      document.getElementById('map-waiting-msg').style.display = 'block';
    });

    socket.on('vowel-movement-state', (data) => {
      if (data && data.active) {
        isVMMode = true;
        document.getElementById('buzzer-view').classList.add('active-view');
        document.getElementById('secret-view').classList.remove('active-view');
        document.getElementById('individual-view').classList.remove('active-view');
        document.getElementById('map-view').classList.remove('active-view');
        document.getElementById('player-image-container').style.display = 'none';

        const qBox = document.getElementById('player-buzzer-question');
        const btn = document.getElementById('buzzer-btn');
        const statusText = document.getElementById('buzzer-status-text');
        const ansBanner = document.getElementById('player-answer-banner');

        const chips = (data.words || []).map(w => `<span class="vm-phone-chip">${w}</span>`).join('');
        qBox.innerHTML = `<div style="font-size:13px; color:#bfdbfe; margin-bottom:6px;">🔤 VOWEL MOVEMENT (${data.revealedCount}/${data.totalWords})</div>${chips}`;
        qBox.style.display = 'block';

        if (data.answerRevealed && data.answer) {
          document.getElementById('player-answer-text').innerText = data.answer;
          ansBanner.style.display = 'block';
        } else {
          ansBanner.style.display = 'none';
        }

        if (data.buzzerActive) {
          btn.classList.add('active'); btn.disabled = false; btn.innerText = 'BUZZ!';
          statusText.style.color = '#4ade80'; statusText.innerText = '🚨 BUZZ IN TO GUESS THE LINK! 🚨';
        } else {
          btn.classList.remove('active'); btn.disabled = true; btn.innerText = data.winner ? 'LOCKED' : 'WAIT';
          statusText.style.color = data.winner ? '#f4d03f' : '#94a3b8';
          statusText.innerText = data.winner ? `⚡ ${data.winner} buzzed first!` : 'Round complete.';
        }
      } else {
        isVMMode = false;
      }
    });

    socket.on('map-state', (data) => {
      if (data && data.active) {
        document.getElementById('buzzer-view').classList.remove('active-view');
        document.getElementById('secret-view').classList.remove('active-view');
        document.getElementById('individual-view').classList.remove('active-view');
        document.getElementById('map-view').classList.add('active-view');
        document.getElementById('player-answer-banner').style.display = 'none';

        document.getElementById('map-prompt-title').innerText = data.prompt || 'Tap the Map!';
        document.getElementById('player-map-img').src = data.mapImage;

        if (!data.pinsRevealed && !mapLockedIn) {
          selectedMapCoords = null;
          document.getElementById('my-map-pin').style.display = 'none';
          document.getElementById('target-map-pin').style.display = 'none';
          document.getElementById('btn-lock-map-pin').style.display = 'block';
          document.getElementById('map-waiting-msg').style.display = 'none';
        }

        if (data.pinsRevealed) {
          mapLockedIn = true;
          document.getElementById('btn-lock-map-pin').style.display = 'none';
          document.getElementById('map-waiting-msg').style.display = 'block';
        }

        if (data.answerRevealed && data.targetX !== null) {
          const targetPin = document.getElementById('target-map-pin');
          targetPin.style.left = `${data.targetX}%`;
          targetPin.style.top = `${data.targetY}%`;
          targetPin.style.display = 'block';
          if (data.answer) {
            document.getElementById('player-answer-text').innerText = data.answer;
            document.getElementById('player-answer-banner').style.display = 'block';
          }
        }
      } else {
        mapLockedIn = false;
        selectedMapCoords = null;
        document.getElementById('map-view').classList.remove('active-view');
      }
    });

    socket.on('update-players', (players) => {
      const savedName = localStorage.getItem('hog_player_name');
      const me = players.find(p => p.name === savedName);
      if (me) {
        document.getElementById('my-score').innerText = me.score;
        document.getElementById('join-screen').style.display = 'none';
        document.getElementById('game-screen').style.display = 'block';
        document.getElementById('welcome-msg').innerText = me.name;
      }
    });

    socket.on('buzzer-state', (data) => {
      if (isVMMode) return;
      if (data.active || data.prompt || data.winner) {
        document.getElementById('buzzer-view').classList.add('active-view');
        document.getElementById('secret-view').classList.remove('active-view');
        document.getElementById('individual-view').classList.remove('active-view');
        document.getElementById('map-view').classList.remove('active-view');
      }
      document.getElementById('player-answer-banner').style.display = 'none';

      const btn = document.getElementById('buzzer-btn');
      const statusText = document.getElementById('buzzer-status-text');
      const qBox = document.getElementById('player-buzzer-question');
      const imgContainer = document.getElementById('player-image-container');

      if (data.image1 && data.image2) {
        qBox.style.display = 'none';
        document.getElementById('player-img1').src = data.image1;
        document.getElementById('player-img2').src = data.image2;
        imgContainer.style.display = 'flex';
      } else if (data.prompt) {
        imgContainer.style.display = 'none';
        qBox.innerText = data.prompt;
        qBox.style.display = 'block';
      } else {
        qBox.style.display = 'none';
        imgContainer.style.display = 'none';
      }

      if (data.active) {
        btn.classList.add('active'); btn.disabled = false; btn.innerText = 'BUZZ!';
        statusText.style.color = '#4ade80'; statusText.innerText = '🚨 BUZZERS ARE LIVE! 🚨';
      } else {
        btn.classList.remove('active'); btn.disabled = true; btn.innerText = data.winner ? 'LOCKED' : 'WAIT';
        statusText.style.color = data.winner ? '#f4d03f' : '#94a3b8';
        statusText.innerText = data.winner ? `⚡ ${data.winner} buzzed first!` : 'Buzzers closed.';
      }
    });

    socket.on('secret-state', (data) => {
      if (data.active) {
        document.getElementById('player-answer-banner').style.display = 'none';
        document.getElementById('secret-view').classList.add('active-view');
        document.getElementById('buzzer-view').classList.remove('active-view');
        document.getElementById('individual-view').classList.remove('active-view');
        document.getElementById('map-view').classList.remove('active-view');
        
        const titleEl = document.getElementById('secret-prompt-title');
        const secImgContainer = document.getElementById('secret-image-container');

        if (data.image1 && data.image2) {
          titleEl.style.display = 'none';
          document.getElementById('sec-img1').src = data.image1;
          document.getElementById('sec-img2').src = data.image2;
          secImgContainer.style.display = 'flex';
        } else {
          secImgContainer.style.display = 'none';
          titleEl.style.display = 'block';
          titleEl.innerText = data.prompt || 'Secret Question';
        }

        if (data.submitted) {
          document.getElementById('input-container').style.display = 'none';
          document.getElementById('waiting-msg').style.display = 'block';
        } else {
          document.getElementById('input-container').style.display = 'block';
          document.getElementById('waiting-msg').style.display = 'none';
          document.getElementById('secret-answer-input').value = '';
        }
      }
    });

    socket.on('individual-state', (data) => {
      if (data.active) {
        document.getElementById('buzzer-view').classList.remove('active-view');
        document.getElementById('secret-view').classList.remove('active-view');
        document.getElementById('map-view').classList.remove('active-view');
        document.getElementById('individual-view').classList.add('active-view');
        document.getElementById('player-answer-banner').style.display = 'none';
        document.getElementById('hl-tier-badge').style.display = 'none';

        const savedName = (localStorage.getItem('hog_player_name') || '').toLowerCase();
        const isMe = socket.id === data.targetId || savedName === (data.targetName || '').toLowerCase();
        const headerMsg = document.getElementById('individual-header-msg');
        const qBox = document.getElementById('player-individual-question');
        const imgContainer = document.getElementById('individual-image-container');
        const instructions = document.getElementById('individual-instructions');

        if (isMe) {
          headerMsg.style.color = '#4ade80';
          headerMsg.innerText = `🎯 IT'S YOUR TURN, ${data.targetName.toUpperCase()}! 🎯`;
          instructions.innerText = 'Answer the host out loud! Waiting for host to award points...';
        } else {
          headerMsg.style.color = '#f4d03f';
          headerMsg.innerText = `⏳ HOT SEAT ROUND`;
          instructions.innerText = `Waiting for ${data.targetName} to answer...`;
        }

        if (data.image1 && data.image2) {
          qBox.style.display = 'none';
          document.getElementById('ind-img1').src = data.image1;
          document.getElementById('ind-img2').src = data.image2;
          imgContainer.style.display = 'flex';
        } else if (data.prompt) {
          imgContainer.style.display = 'none';
          qBox.innerText = data.prompt;
          qBox.style.display = 'block';
        }
      }
    });

    socket.on('highbrow-lowbrow-state', (data) => {
      if (data && data.active) {
        document.getElementById('buzzer-view').classList.remove('active-view');
        document.getElementById('secret-view').classList.remove('active-view');
        document.getElementById('map-view').classList.remove('active-view');
        document.getElementById('individual-view').classList.add('active-view');
        document.getElementById('player-answer-banner').style.display = 'none';
        document.getElementById('individual-image-container').style.display = 'none';

        const savedName = (localStorage.getItem('hog_player_name') || '').toLowerCase();
        const isMe = socket.id === data.targetId || savedName === (data.targetName || '').toLowerCase();
        const headerMsg = document.getElementById('individual-header-msg');
        const tierBadge = document.getElementById('hl-tier-badge');
        const qBox = document.getElementById('player-individual-question');
        const instructions = document.getElementById('individual-instructions');

        tierBadge.style.display = 'inline-block';
        tierBadge.innerText = data.tier === 'highbrow' ? '🎩 HIGHBROW (2 POINTS)' : '🧢 LOWBROW (1 POINT)';

        if (isMe) {
          headerMsg.style.color = '#4ade80';
          headerMsg.innerText = `🎯 YOUR TURN, ${data.targetName.toUpperCase()}!`;
          instructions.innerText = 'Answer out loud to the host!';
        } else {
          headerMsg.style.color = '#f4d03f';
          headerMsg.innerText = `🎭 HIGHBROW / LOWBROW`;
          instructions.innerText = `${data.targetName} is in the hot seat...`;
        }

        qBox.innerText = data.prompt;
        qBox.style.display = 'block';
      }
    });

    socket.on('correct-answer-reveal', (answer) => {
      document.getElementById('player-answer-text').innerText = answer;
      document.getElementById('player-answer-banner').style.display = 'block';
    });
  </script>
</body>
</html>
